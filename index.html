<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AITube">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Il tuo percorso gratuito per imparare l’intelligenza artificiale.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>AITube</title>
<style>
:root{
  --bg:#14100d;--s1:#1c1713;--s2:#261f18;--hv:#31281e;--ln:#3a3025;--ln2:#4d3f2f;
  --tx:#faf5ee;--mu:#b9ac9c;--ac:#ff7a1a;--ac2:#ffa24d;--on:#1c0e03;--dn:#ff6b5f;--dnx:#2b0805;
  --glass:color-mix(in srgb,var(--bg) 68%,transparent);
  --blur:blur(24px) saturate(1.7);
  --ease:cubic-bezier(.32,.72,0,1);
  --si:env(safe-area-inset-top,0px);
  --edge:.45;
  --top:calc(var(--si) + var(--si) * var(--edge));
  --hh:calc(60px + var(--top));
  --tb:calc(100px + env(safe-area-inset-bottom,0px));
  --side:0px;--gx:28px;
}
:root[data-theme=light]{
  --bg:#fffaf4;--s1:#ffffff;--s2:#f8ecdc;--hv:#f0dec4;--ln:#e8d8c3;--ln2:#d6c0a2;
  --tx:#241a10;--mu:#6a594a;--ac:#cf410a;--ac2:#b03508;--on:#ffffff;--dn:#c5221b;--dnx:#ffffff;
}
@supports not (backdrop-filter:blur(1px)){:root{--glass:color-mix(in srgb,var(--bg) 96%,transparent)}}
@media(prefers-reduced-transparency:reduce){:root{--glass:var(--bg)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scrollbar-color:var(--ln2) transparent;-webkit-text-size-adjust:100%}
:root[data-theme=light]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{display:block}
.ic.flip svg{transform:scaleY(-1)}
.skip{position:fixed;left:12px;top:-60px;z-index:100;height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--tx);color:var(--bg);font-weight:600;transition:top .25s var(--ease)}
.skip:focus-visible{top:calc(env(safe-area-inset-top,0px) + 10px)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

/* header */
header{position:fixed;inset:var(--top) 0 auto;height:60px;padding:0 16px;display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;align-items:center;gap:12px;z-index:30;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--ln)}
.hl{display:flex;align-items:center;gap:6px;min-width:0}
.hr{display:flex;justify-content:flex-end;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:none;display:grid;place-items:center;transition:background .2s,transform .2s var(--ease)}
.ib:active{transform:scale(.92)}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.04em}
.lg{width:32px;height:32px;border-radius:9px;display:block;flex:none}
.logo em{font-style:normal;color:var(--ac2)}
#sf{position:relative;height:42px}
#sf .ic{position:absolute;left:15px;top:50%;width:20px;height:20px;margin-top:-10px;line-height:0;color:var(--mu);pointer-events:none}
#sf input{width:100%;height:42px;border:1px solid var(--ln);background:var(--s1);border-radius:999px;padding:0 46px 0 46px;font-size:15px;outline:0;transition:border-color .2s,background .2s}
#sf input:focus{border-color:var(--ac);background:var(--bg)}
#sf input::placeholder,.sbox input::placeholder{color:var(--mu);opacity:1}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.kb{position:absolute;right:12px;top:10px;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--ln2);border-radius:6px;color:var(--mu);font:600 12px/20px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;pointer-events:none}
.clr{position:absolute;right:6px;top:5px;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--mu);display:none;place-items:center;transition:background .2s}
#sf.has .kb{display:none}
#sf.has .clr{display:grid}
@media(hover:none){.kb{display:none}}

/* sidebar */
.side{position:fixed;top:var(--hh);bottom:0;left:0;width:264px;overflow:auto;overscroll-behavior:contain;padding:12px 12px 32px;z-index:22;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:1px solid var(--ln);transform:translateX(-100%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s;scrollbar-width:thin}
body.open .side{transform:none;visibility:visible;transition-delay:0s}
#scrim{display:none;position:fixed;inset:var(--hh) 0 0 0;z-index:21;background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
@media(min-width:901px) and (max-width:1279px){#scrim{display:block}body.open #scrim{opacity:1;pointer-events:auto}}
main{margin:var(--hh) 0 0 var(--side);padding:0 var(--gx) 72px;min-width:0;min-height:calc(100vh - var(--hh));min-height:calc(100dvh - var(--hh));transition:margin .38s var(--ease)}
#root{outline:0}
#sb{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--bg);z-index:31;pointer-events:none}
#root.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.2)}100%{transform:scale(1)}}

.ni{display:flex;align-items:center;gap:14px;min-height:42px;padding:0 12px;border-radius:12px;font-size:14.5px;transition:background .2s,color .2s}
.ni .ic{color:var(--mu);transition:color .2s}
.ni.on{background:var(--s2);font-weight:650}
.ni.on .ic{color:var(--ac2)}
.ni .n{margin-left:auto;font-size:12.5px;color:var(--mu);font-weight:550;font-variant-numeric:tabular-nums}
.ni.sm{min-height:38px;padding-left:46px;font-size:14px}
.ni .chv{margin-left:auto;color:var(--mu)}
.ni .n+.chv{margin-left:8px}
.side h4{margin:20px 12px 6px;font-size:13px;font-weight:650;color:var(--mu)}
.side hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px}
@media(hover:hover){.ni:hover{background:var(--hv)}.ib:hover{background:var(--hv)}.clr:hover{background:var(--hv)}}

/* switch */
.prefs{display:flex;flex-direction:column;gap:2px}
.sw{display:flex;align-items:center;gap:14px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:12px;background:none;text-align:left;font-size:14.5px;transition:background .2s}
.sw .tx{flex:1;min-width:0}
.sw .d{display:block;margin-top:1px;color:var(--mu);font-size:13px;font-weight:400;line-height:1.35}
.sw .st{position:relative;flex:none;width:42px;height:26px;border-radius:13px;background:var(--hv);border:1px solid var(--ln2);transition:background .3s var(--ease),border-color .3s}
.sw .st::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:transform .35s var(--ease),background .3s}
.sw[aria-checked=true] .st{background:var(--ac);border-color:var(--ac)}
.sw[aria-checked=true] .st::after{transform:translateX(16px);background:var(--on)}
@media(hover:hover){.sw:hover{background:var(--hv)}}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border:0;border-radius:999px;background:var(--s2);font-size:14px;font-weight:550;white-space:nowrap;transition:background .2s,color .2s,transform .15s var(--ease)}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--tx);color:var(--bg)}
@media(hover:hover){.pill:not(.on):hover{background:var(--hv)}}
.chips{position:sticky;top:var(--hh);z-index:6;margin:0 calc(var(--gx) * -1) 14px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid transparent;transition:border-color .25s}
.chips.stuck{border-bottom-color:var(--ln)}
.chips-in{position:relative;display:flex;gap:8px;overflow-x:auto;padding:10px var(--gx);scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--gx),#000 calc(100% - var(--gx)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--gx),#000 calc(100% - var(--gx)),transparent)}
.chips-in::-webkit-scrollbar{display:none}
.chips .sp{width:1px;background:var(--ln2);margin:6px 4px;flex:none}

h1{font-size:24px;line-height:1.2;margin:18px 0 16px;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
h1 small{font-size:14px;color:var(--mu);font-weight:450;letter-spacing:0}
.mu{color:var(--mu)}

/* progress */
.trk{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.trk i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .7s var(--ease)}
.prog{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;margin:6px 0 8px}
.prog .trk{background:var(--hv)}
.pt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:var(--mu)}
.pt b{font-size:28px;font-weight:750;letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums}
.pt .pc{font-weight:650;color:var(--tx);font-variant-numeric:tabular-nums}
.pgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.pgl{display:block;border-radius:10px}
.pgl .trk{margin-bottom:8px}
.pgl .l1{display:block;font-weight:600;font-size:13.5px}
.pgl .l2{display:block;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
@media(hover:hover){.pgl:hover .l1{color:var(--ac2)}}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 18px}
.grid h2{grid-column:1/-1;margin:22px 0 -4px;font-size:18px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px}
.grid h2:first-child{margin-top:8px}
.grid h2 small{font-size:13px;font-weight:500;color:var(--mu);font-variant-numeric:tabular-nums}
.grid h2::after{content:"";flex:1;height:1px;background:var(--ln);align-self:center;order:3}
.card{position:relative;content-visibility:auto;contain-intrinsic-size:auto 260px}
.cl{display:block;border-radius:14px}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--s2);transition:border-radius .35s var(--ease)}
.th img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s,transform .5s var(--ease)}
.th img.ld{opacity:1}
.card.seen .th img.ld{opacity:.6}
.card.dis .th img.ld{opacity:.35}
.lv,.ty,.bg{position:absolute;bottom:8px;font-size:12px;font-weight:700;line-height:1;padding:5px 8px;border-radius:7px;color:#fff;background:rgba(20,16,13,.62);-webkit-backdrop-filter:blur(10px) saturate(1.5);backdrop-filter:blur(10px) saturate(1.5)}
.lv{left:8px;background:var(--ac);color:var(--on);-webkit-backdrop-filter:none;backdrop-filter:none}
.ty{right:8px}
.bg{left:8px;top:8px;bottom:auto}
.later{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border-radius:10px;border:0;background:rgba(20,16,13,.62);-webkit-backdrop-filter:blur(10px) saturate(1.5);backdrop-filter:blur(10px) saturate(1.5);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.9);transition:opacity .2s,transform .25s var(--ease),background .2s}
.later.on{opacity:1;transform:none;background:var(--ac);color:var(--on);-webkit-backdrop-filter:none;backdrop-filter:none}
.later:focus-visible{opacity:1;transform:none}
@media(hover:hover){.card:hover .later{opacity:1;transform:none}.card:hover .th{border-radius:7px}.card:hover .th img{transform:scale(1.04)}}
@media(hover:none){.later{opacity:1;transform:none}}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac)}
.meta{display:flex;gap:12px;padding:12px 2px 0}
.mt{min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:750;font-size:15px;background:hsl(var(--h) 38% 26%);color:hsl(var(--h) 85% 88%)}
:root[data-theme=light] .av{background:hsl(var(--h) 65% 90%);color:hsl(var(--h) 60% 26%)}
.tt{font-weight:620;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sub{color:var(--mu);font-size:13.5px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{width:3px;height:3px;border-radius:50%;background:var(--mu);display:inline-block;margin:0 7px;vertical-align:middle}
.empty{padding:72px 16px;text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:14px;font-size:15px}
.empty .ic{color:var(--ac2)}

/* buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--s2);font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,color .2s,transform .15s var(--ease)}
.bt:active{transform:scale(.96)}
.bt.on,.bt.pri{background:var(--ac);color:var(--on)}
.bt.dn{background:var(--dn);color:var(--dnx)}
.bt.lk.on svg path{fill:currentColor}
.bt.lk.on .ic{animation:pop .4s var(--ease)}
@media(hover:hover){.bt:not(.on):not(.pri):not(.dn):hover{background:var(--hv)}}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--s2);flex:none}
.seg .bt{border-radius:0;background:none}
.seg .bt.on{background:var(--ac)}
.seg .bt+.bt{border-left:1px solid var(--ln)}
@media(hover:hover){.seg .bt:not(.on):hover{background:var(--hv)}}

/* search view */
.sbox{position:sticky;top:var(--hh);z-index:6;margin:0 calc(var(--gx) * -1) 12px;padding:12px var(--gx);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sbox .ic{position:absolute;left:calc(var(--gx) + 16px);top:50%;width:20px;height:20px;margin-top:-10px;line-height:0;color:var(--mu);pointer-events:none}
.sbox input{width:100%;height:48px;border:1px solid var(--ln);background:var(--s1);border-radius:999px;padding:0 48px;font-size:16px;outline:0;transition:border-color .2s}
.sbox input:focus{border-color:var(--ac)}
.sbox .clr{right:calc(var(--gx) + 6px);top:20px}
.sbox.has .clr{display:grid}
.tpc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* watch */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;max-width:1760px;margin:0 auto;padding-top:20px;align-items:start}
.watch.cin,.watch.nr{grid-template-columns:minmax(0,1fr)}
.pl{aspect-ratio:16/9;width:100%;border-radius:18px;overflow:hidden;background:#000}
.cin .wm,.cin .rel{width:min(100%,calc(78vh * 16 / 9));margin-left:auto;margin-right:auto}
.pl iframe{width:100%;height:100%;border:0;display:block}
.wt{display:block;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.3;margin:16px 0 14px}
.ar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ch{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.ch b{display:block;font-size:15px}
.ch span{font-size:13px;color:var(--mu)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-top:16px}
.box h3{margin:0 0 10px;font-size:15px}
.box p{margin:6px 0;color:var(--mu)}
.box .hint{font-size:13px;margin:8px 0 0}
.tag{display:inline-block;background:var(--s2);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-size:13px;font-weight:600}
.tag.o{background:var(--ac);color:var(--on)}
.box a{color:var(--ac2);font-weight:600}
@media(hover:hover){.box a:hover{text-decoration:underline}}
textarea{display:block;width:100%;min-height:112px;resize:vertical;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;line-height:1.5;transition:border-color .2s}
textarea:focus{border-color:var(--ac)}
textarea::placeholder{color:var(--mu);opacity:1}
.rel{display:flex;flex-direction:column;gap:12px}
.rel h3{margin:8px 0 0;font-size:16px}
.rel h3:first-child{margin-top:0}
.ri{display:flex;gap:12px;border-radius:12px;padding:6px;margin:-6px;transition:background .2s}
.ri.cur{background:var(--s2)}
@media(hover:hover){.ri:not(.cur):hover{background:var(--s1)}}
.ri .th{width:168px;flex:none;border-radius:10px}
.ri .tt{font-size:14.5px;-webkit-line-clamp:3}
.ri .now{color:var(--ac2);font-size:12.5px;font-weight:650;margin-bottom:2px}
@media(min-width:1101px){.watch:not(.cin) .rel{position:sticky;top:calc(var(--hh) + 16px);max-height:calc(100vh - var(--hh) - 32px);max-height:calc(100dvh - var(--hh) - 32px);overflow:auto;overscroll-behavior:contain;padding:6px;margin:-6px;scrollbar-width:thin}}

/* library / profile */
.me{max-width:760px}
.sh{margin:30px 0 10px;font-size:16px}
.lst{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--s1)}
.lst .ni{min-height:54px;border-radius:0;padding:0 16px}
.lst .ni+.ni{border-top:1px solid var(--ln)}
.me .prefs{border:1px solid var(--ln);border-radius:14px;background:var(--s1);padding:4px}
.sc{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:4px;border-radius:999px;background:var(--s2);border:1px solid var(--ln)}
.sc button{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--mu);font-weight:600;font-size:14px;transition:background .25s,color .25s}
.sc button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.dat{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;color:var(--mu);font-size:13.5px}
.keys kbd{display:inline-block;min-width:22px;height:22px;padding:0 6px;margin-right:6px;border:1px solid var(--ln2);border-radius:6px;font:600 12px/20px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
@media(hover:none){.keys{display:none}}

/* toast & dialog */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--s2) 78%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--ln2);color:var(--tx);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--ease);z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act.on{pointer-events:auto}
.tu{border:0;background:none;padding:2px 4px;margin:-2px -4px -2px 0;border-radius:6px;color:var(--ac2);font-weight:700}
.scrim2{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 48%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);animation:fade .25s var(--ease);transition:opacity .2s}
.scrim2.out{opacity:0}

  if(kind==="later")list.sort((a,b)=>S.later[b.id]-S.later[a.id]);
  if(kind==="history")list.sort((a,b)=>S.hist[b.id]-S.hist[a.id]);
  const chips=chipsBar(...Object.keys(T).map(x=>h("a",{class:"pill"+(x===kind?" on":""),href:"#/"+x,"aria-current":x===kind?"page":null},T[x][1])));
  const hd=h("h1",{},ic(M2[0],26,kind==="disliked"),M2[1],h("small",{},list.length+" video"));
  if(kind==="history"&&list.length)hd.append(h("button",{type:"button",class:"pill",style:"margin-left:auto",on:{click:async()=>{
    if(await ask("Cancellare la cronologia?","Tutti i video torneranno a risultare non visti e i progressi ripartiranno da zero.","Cancella")){S.hist={};save();nav();route(true);toast("Cronologia cancellata")}

  const W=h("div",{class:"watch"+(S.p.cin?" cin":"")+(rel.length?"":" nr")},
    h("div",{class:"wm"},
      h("div",{class:"pl"},h("iframe",{src:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`,allow:"autoplay; encrypted-media; picture-in-picture; fullscreen",allowfullscreen:"",title:v.title})),

          h("div",{class:"act"},h("div",{class:"seg"},bL,bD),bW,bS,bC,bK,nxt?h("a",{class:"bt pri",href:"#/v/"+nxt.id},ic("play",18),"Prossimo"):null)),

const isTxt=el=>el&&/^(INPUT|TEXTAREA)$/.test(el.tagName);
addEventListener("focusin",e=>{if(isTxt(e.target)&&innerWidth<=900)document.body.classList.add("typing")});
addEventListener("focusout",()=>setTimeout(()=>{if(!isTxt(document.activeElement))document.body.classList.remove("typing")},60));

/* ---------- instradamento ---------- */
let viaLink=false,vt,lastY=0,pos={},raf=0;
addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#/"]');
  if(a&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){viaLink=true;clearTimeout(vt);vt=setTimeout(()=>{viaLink=false},500)}
},true);
function stuck(){
  const c=$(".chips");
  if(c)c.classList.toggle("stuck",c.getBoundingClientRect().top<=$("header").getBoundingClientRect().bottom+1);
}
addEventListener("scroll",()=>{lastY=scrollY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;stuck()})},{passive:true});
function enter(){root.classList.remove("enter");void root.offsetWidth;root.classList.add("enter")}
function route(keep){
  if(!V.length)return;
  const{k,a}=parse();
  syncW=null;
  const px=(root.querySelector(".chips-in")||{}).scrollLeft;
  if(k!=="v")document.title="AITube";
  if(k==="v")watch(a);
  else if(k==="cerca")search();
  else if(k==="lib")me();
  else if(["later","liked","disliked","history"].includes(k))lib(k);
  else home(k,a);
  nav();
  const ci=root.querySelector(".chips-in");
  if(ci){
    const on=ci.querySelector(".on");
    if(keep&&px!=null)ci.scrollLeft=px;
    else if(on)ci.scrollLeft=on.offsetLeft-(ci.clientWidth-on.offsetWidth)/2;
  }
  if(!keep){
    const ae=document.activeElement;
    if(ae&&ae!==document.body&&ae.id!=="q"&&ae.blur&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))ae.blur();
    enter();
    const y=(!viaLink&&pos[hk()])||0;
    scrollTo(0,y);lastY=y;viaLink=false;
  }
  stuck();
}
addEventListener("hashchange",e=>{
  pos[(e.oldURL.split("#")[1]||"")||"/"]=lastY;
  closeDrawer();
  route();
});
addEventListener("storage",e=>{
  if(e.key!==KEY)return;
  load();nav();syncSw();
  if(parse().k!=="v")route(true);

const d=JSON.parse($("#curriculum-data").textContent);
let ord=0;
for(const st of d.stages)for(const t of st.topics)for(const b of (t.blocks||[{videos:t.videos}]))for(const v of b.videos){
  const x={...v,level:st.level,topic:t.topic,ord:ord++};
  x._s=norm([x.title,x.channel,label(x),TOPICS[x.topic]||"",x.note||"",x.type||""].join(" "));
  V.push(x);M[x.id]=x;
  if(x.series)(BS[x.series]=BS[x.series]||[]).push(x);
}
route();
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(e=>console.error("Registrazione PWA non riuscita:",e)));
}
